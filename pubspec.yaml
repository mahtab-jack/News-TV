name: news_tv
description: Premium Live TV Desktop Application
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  window_manager: ^0.4.3
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_windows_video: ^1.0.10
  qr_flutter: ^4.1.0
  http: ^1.1.0
  shared_preferences: ^2.2.0
  google_fonts: ^6.1.0
  path: ^1.8.3
  cached_network_image: ^3.3.0
  url_launcher: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1
  msix: ^3.16.7

flutter:
  uses-material-design: true
  assets:
    - assets/mahtab.jpg
    - assets/logo.png

flutter_launcher_icons:
  android: false
  image_path: "assets/logo.png"
  windows:
    generate: true
    image_path: "assets/logo.png"
    icon_size: 48

msix_config:
  display_name: News TV
  publisher_display_name: News TV
  publisher: "CN=NewsTV"
  identity_name: com.newstv.app
  logo_path: assets/logo.png
  create_desktop_shortcut: true
  install_on_launch: true

